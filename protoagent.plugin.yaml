id: calendar
name: Calendar
version: 0.2.0
description: >-
  Human events, iCalendar subscriptions, Google Calendar overlay, and Scheduler
  occurrences in one month, week, and agenda workspace.
enabled: false
min_protoagent_version: "0.147.0"
repository: https://github.com/RomeoRaven/calendar-plugin
homepage: https://agent.protolabs.studio
capabilities:
  network: [operator-configured HTTPS iCalendar feeds]
  filesystem: instance-scoped calendar state
public_paths:
  - /plugins/calendar/assets/
subscribes: ["scheduler.fired"]
views:
  - { id: main, label: "Calendar", icon: CalendarDays, path: /plugins/calendar/view }
